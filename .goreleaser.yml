version: 2

project_name: graingraph

before:
  hooks:
    - go mod tidy
    - go mod verify

# The release attaches graingraph-query binaries (the Neo4j Query API server),
# a source archive (every tracked file at the tag, made with git archive) for
# the Go library, and SHA256 checksums.
builds:
  - id: graingraph-query
    main: ./cmd/graingraph-query
    binary: graingraph-query
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s", "-w"]

archives:
  - formats: [tar.gz]
    name_template: "graingraph-query_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  prefix_template: "{{ .ProjectName }}_{{ .Version }}/"
  format: tar.gz

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
      - "^Merge (remote-tracking branch|origin/)"
