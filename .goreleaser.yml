version: 2

project_name: charta

before:
  hooks:
    - go mod tidy
    - go mod verify

# charta is a Go library: there are no binaries to build or archive. The
# release attaches a source archive (every tracked file at the tag, made with
# git archive) and SHA256 checksums.
builds:
  - skip: true

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  prefix_template: "{{ .ProjectName }}_{{ .Version }}/"
  format: tar.gz

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
