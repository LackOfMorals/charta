# Rewritten 2026-10-09 for the current architecture: queries are parsed by
# cypher/syntax, checked by cypher/analyze and executed by the Go interpreter
# (cypher/interp) directly against SQLite; the SQL translator, planner and plan
# cache no longer exist. Cypher schema commands (CREATE/DROP INDEX|CONSTRAINT,
# SHOW ...), VECTOR/POINT/temporal values and quantified path patterns already
# exist. Verification commands: CGO_ENABLED=0 go build ./... ; go vet ./... ;
# CGO_ENABLED=0 go test -count=1 ./... ; CGO_ENABLED=0 go test -count=1
# -tags=tck ./compat/... (TCK and Neo4j-extension suites must stay at 100%).
feature: property-indexes-constraints
prd: ./prd-property-indexes-constraints.md
created_at: 2026-09-24T00:00:00Z
updated_at: 2026-10-09T00:00:00Z

tasks:
  - id: task-001
    title: "Declare indexes and constraints (SQLite expression indexes, metadata table)"
    description: |
      Superseded by Cypher schema commands. CREATE INDEX / CREATE CONSTRAINT are executed by cypher/interp
      (schema.go); definitions live in the graphlite_schema table and RANGE/TEXT indexes and the lookup index
      of unique/key constraints are SQLite expression indexes gl_idx_<id>. The PRD's property_index_meta table
      and store.CreatePropertyIndex were not needed.
    status: completed
    notes: "Done in commit 53b9b4c; covered by compat/testdata/neo4j/SchemaCommands.feature (25 scenarios)."
    dependencies: []
    acceptance_criteria:
      - "CREATE [RANGE] INDEX and CREATE CONSTRAINT ... IS UNIQUE|NODE KEY|NOT NULL|:: TYPE work for nodes and relationships"
      - "DROP INDEX/CONSTRAINT, IF [NOT] EXISTS and SHOW INDEXES/CONSTRAINTS work"

  - id: task-002
    title: "Constraint enforcement and structured errors"
    description: |
      Constraints are enforced in graph.finish() over created/changed entities and a violation rolls the
      statement back (interp error ConstraintVerificationFailed / ConstraintValidationFailed). Multi-label nodes
      are supported because uniqueness is checked at application level, which resolves the PRD's
      single-label restriction.
    status: completed
    notes: "Done in commit 53b9b4c."
    dependencies:
      - task-001
    acceptance_criteria:
      - "Duplicates, missing required properties, wrong types and node-key violations are rejected"
      - "A failed statement leaves no partial writes"

  - id: task-003
    title: "Public Go error type for constraint violations"
    description: |
      Map interp errors with class ConstraintVerificationFailed / code ConstraintValidationFailed to a public
      *graphlite.ErrConstraintViolation{Constraint, Kind, Label, Properties, Detail} in engine.go (like
      ErrUnsupportedCypher is mapped), so callers can use errors.As. Include the constraint name in the
      interp error so it can be reported.
    status: completed
    notes: "Done: graphlite.ErrConstraintViolation (constraint_error.go) mapped in execError; interp.Error carries a SchemaRef; vector index dimension errors use it too."
    dependencies:
      - task-002
    acceptance_criteria:
      - "errors.As(err, &*ErrConstraintViolation) succeeds for a duplicate on a unique constraint"
      - "The error carries the constraint name, label and property names"
      - "The existing interp error text and TCK expectations are unchanged"

  - id: task-004
    title: "Go API wrappers over the Cypher schema commands"
    description: |
      Add thin DB methods for callers that prefer Go over Cypher: CreatePropertyIndex(ctx, label, property),
      CreateUniqueConstraint(ctx, label, property), DropPropertyIndex / DropConstraint (by name) and
      ListSchema(ctx) []SchemaInfo. Implement by running the corresponding Cypher through runInterp with
      validated, quoted identifiers (reject labels/properties that are not plain identifiers or backtick-quote
      them correctly); no new storage code. SchemaInfo mirrors SHOW INDEXES/CONSTRAINTS columns.
    status: completed
    notes: "Done: DB.CreatePropertyIndex, CreateUniqueConstraint, DropIndex, DropConstraint, ListSchema (schema_api.go); names are backtick-quoted, empty/NUL rejected."
    dependencies:
      - task-003
    acceptance_criteria:
      - "The methods create, list and drop the same objects the Cypher commands do"
      - "Identifiers that need quoting are quoted or rejected, never concatenated unescaped"
      - "ListSchema reports kind, entity type, labels/types, properties and owning constraint"

  - id: task-005
    title: "Verify index usage with EXPLAIN QUERY PLAN"
    description: |
      Add tests that run EXPLAIN QUERY PLAN for the SQL the interpreter issues (scanNodes with a property
      hint) against (a) a declared RANGE index, (b) a constraint's backing index and (c) an automatic index
      (idx_auto_np_*), asserting SEARCH ... USING INDEX rather than SCAN. Also assert relationship property
      indexes (CREATE INDEX FOR ()-[r:R]-() ON (r.p)) are created; and decide whether interp should use them:
      if lookups by relationship property are not served by an index, add the hint path in match.go expand().
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "Plans for indexed property lookups use the index"
      - "The decision on relationship property index use is recorded, with a test"

  - id: task-006
    title: "Constraints during bulk Import and Export/Import of schema"
    description: |
      importer.go writes through the store and bypasses constraints. After each Import call (or batch) validate
      the imported entities against existing constraints and fail the import with ErrConstraintViolation (the
      import is one transaction, so nothing is applied). Decide whether Export/Import JSON should carry schema
      definitions; if yes add an optional "schema" section restored after the data.
    status: pending
    dependencies:
      - task-003
    acceptance_criteria:
      - "An import that violates a unique/existence/type constraint fails atomically"
      - "The schema-in-export decision is recorded and, if adopted, round-trips in a test"

  - id: task-007
    title: "Schema survives reopen, Snapshot and CopyTo"
    description: |
      Tests: definitions and backing indexes persist after closing and reopening a file database; Snapshot
      copies the graphlite_schema table; constraint enforcement still works after reopen without any warm-up.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "Reopening a database keeps indexes and constraints enforced"
      - "A Snapshot opened as a new database has the same schema"

  - id: task-008
    title: "Benchmark: indexed vs unindexed property lookup"
    description: |
      Add a benchmark at 100k+ nodes for MATCH (n:L {p: $v}): no index, declared index and automatic index.
      Record results in the progress file. (At 2,000 nodes the automatic index already turns a 600 us lookup
      into 20 us.)
    status: pending
    dependencies:
      - task-005
    acceptance_criteria:
      - "The benchmark shows the declared and automatic index paths faster than the scan"
      - "Results are recorded in .plans/progress-property-indexes-constraints.txt"

  - id: task-009
    title: "Documentation and final verification"
    description: |
      Document CREATE INDEX/CONSTRAINT, SHOW, the Go wrappers, enforcement semantics (checked when a
      statement finishes; Import checked after task-006) and the automatic index policy in README and AGENTS.md.
      Run the standard verification commands.
    status: pending
    dependencies:
      - task-004
      - task-006
      - task-007
      - task-008
    acceptance_criteria:
      - "README and AGENTS.md describe schema commands and the Go API"
      - "build, vet, tests and both compat suites pass"

