# Rewritten 2026-10-09 for the current architecture: queries are parsed by
# cypher/syntax, checked by cypher/analyze and executed by the Go interpreter
# (cypher/interp) directly against SQLite; the SQL translator, planner and plan
# cache no longer exist. Cypher schema commands (CREATE/DROP INDEX|CONSTRAINT,
# SHOW ...), VECTOR/POINT/temporal values and quantified path patterns already
# exist. Verification commands: CGO_ENABLED=0 go build ./... ; go vet ./... ;
# CGO_ENABLED=0 go test -count=1 ./... ; CGO_ENABLED=0 go test -count=1
# -tags=tck ./compat/... (TCK and Neo4j-extension suites must stay at 100%).
feature: vector-search
prd: ./prd-vector-search.md
created_at: 2026-09-24T00:00:00Z
updated_at: 2026-10-09T00:00:00Z


# Performance baseline (2026-10-09, Apple M5 Max, 18 cores, Go 1.26, float32, 100,000 vectors x 384 dims,
# one query = score every vector and keep the best):
#   naive loop                          24.1 ms
#   unrolled, 4 accumulators             7.5 ms
#   unrolled, 8 accumulators             7.2 ms
#   unrolled, 8 accumulators, 18 cores   0.82 ms
#   float64 naive                       23.9 ms   (float32 gives no speed-up until the loop is unrolled)
#   decode 384 floats from JSON text    10.3 us each  (about 1 s per 100k vectors)
#   decode 384 floats from a blob        0.09 us each (about 10 ms per 100k vectors)
# Conclusion: decoding dominates, so cache a contiguous float32 matrix; then unroll; then parallelise;
# assembly and quantisation are decided from benchmark data (task-009).

tasks:
  - id: task-001
    title: "VECTOR values and similarity functions"
    description: |
      Superseded by the Cypher 25 vector support in the interpreter: the VECTOR value type
      (cypher/vector), vector(), vector_dimension_count(), vector_norm(), vector_distance() with EUCLIDEAN,
      EUCLIDEAN_SQUARED, MANHATTAN, COSINE, DOT and HAMMING, vector.similarity.cosine/euclidean, storage as
      properties, IS :: VECTOR<FLOAT32>(n) type predicates and CREATE VECTOR INDEX recorded as metadata. The
      naming question in the PRD is settled in favour of the Neo4j names.
    status: completed
    notes: "Done in commit 371bc30."
    dependencies: []
    acceptance_criteria:
      - "compat/testdata/neo4j/Vector.feature passes"

  - id: task-002
    title: "Validate VECTOR index options at creation"
    description: |
      CREATE VECTOR INDEX name FOR (n:L) ON (n.p) OPTIONS {indexConfig: {`vector.dimensions`: 384,
      `vector.similarity_function`: 'cosine'}} currently records any options. Validate: dimensions an integer in
      [1, 4096] (required), similarity_function 'cosine' or 'euclidean' (default cosine), unknown keys rejected.
      Store the parsed values in the schema definition so later tasks read them without re-parsing, and show them in
      SHOW INDEXES (add an options column, as Neo4j does).
    status: completed
    notes: "PR #10"
    dependencies:
      - task-001
    acceptance_criteria:
      - "An index without dimensions or with an invalid value fails with a schema error"
      - "SHOW INDEXES YIELD options returns the dimensions and similarity function"

  - id: task-003
    title: "Enforce dimension and element type on write"
    description: |
      In graph.finish() (next to checkConstraints) validate every created or changed node that has a label with a
      vector index: the indexed property must be a VECTOR value or a list of numbers whose dimension equals the
      declared one; null/absent is allowed. A violation is a ConstraintVerificationFailed-style error naming the
      index and the expected dimension, and the statement rolls back.
    status: completed
    notes: "PR #10"
    dependencies:
      - task-002
    acceptance_criteria:
      - "A correctly dimensioned VECTOR or LIST<FLOAT> is accepted"
      - "A wrong dimension or a non-numeric element is rejected and nothing is written"
      - "Changing the property or adding the label to an existing node is checked too"

  - id: task-004
    title: "In-memory vector matrix per index"
    description: |
      Measured on an Apple M5 Max (see the performance note at the end of this file): decoding one 384-float vector
      from JSON text costs about 10 us (about 1 s per 100k vectors) while a binary decode costs 0.1 us and the dot
      product itself 0.07 us. Decoding, not arithmetic, is what a brute-force search would spend its time on, so
      the search must not decode properties per query.
      Keep one matrix per vector index in cypher/vector (or a small internal type held by interp.Engine): ids []int64
      and data []float32 laid out contiguously (row i at data[i*dim:(i+1)*dim]), plus precomputed norms (or
      pre-normalised rows when the similarity function is cosine, so cosine is a dot product). Build it lazily on
      first query by scanning the label's nodes (node_labels index) and decoding each vector property once (VECTOR
      values and LIST<number> are both accepted; coordinates are converted to float32). Keep it current: graph.finish()
      already knows the created, changed and deleted nodes, so apply those deltas (insert, replace, tombstone and
      compact) after a successful statement and drop the cache on rollback or schema change. Cap total cache memory
      (a limit option, default a few hundred MB) and fall back to decoding from the database for an index over the
      cap. The cache is shared by concurrent readers: guard it with an RWMutex and publish immutable snapshots
      (copy-on-write of the id/row slices) so a search never sees a half-updated matrix.
      If building from JSON is too slow for large indexes (about 1 s per 100k), add a binary side table
      graphlite_vectors(index_id, node_id, blob) maintained in graph.finish() and build the cache from it.
    status: completed
    notes: "PR #12 (design note in progress file: RWMutex matrix, not copy-on-write)"
    dependencies:
      - task-003
    acceptance_criteria:
      - "The first query builds the matrix from existing data; later writes (create, set, remove, delete, label change) are reflected without a rebuild"
      - "A rolled-back statement leaves the cache unchanged"
      - "Concurrent searches and writes pass go test -race and never observe a partial update"
      - "Exceeding the memory cap degrades to the slower path instead of failing"

  - id: task-005
    title: "float32 distance kernels in pure Go"
    description: |
      Add dot, squared Euclidean and cosine kernels over []float32 to cypher/vector. Write them with 8 independent
      accumulators and a scalar tail: measured on the M5 Max this is 3.3x faster than the naive loop (7.3 ms against
      24 ms per 100k x 384 vectors) because the separate sums break the add dependency chain, and it needs no CGO
      or assembly. Use them for the search only; vector_distance() and vector.similarity.* keep their float64 maths
      so existing results do not change. Test the kernels against a float64 reference over random vectors and
      awkward dimensions (1, 3, 7, 8, 9, 383, 4096) with a relative tolerance.
    status: completed
    notes: "PR #11: 3.9x over naive"
    dependencies:
      - task-001
    acceptance_criteria:
      - "Kernels agree with the float64 reference within 1e-4 relative error for all tested dimensions"
      - "A benchmark shows at least 2.5x over the naive float32 loop at dimension 384"
      - "No assembly and no CGO"

  - id: task-006
    title: "Parallel scan with a bounded top-k"
    description: |
      Search the matrix with a worker pool: split the rows into contiguous chunks, each worker keeps its own bounded
      min-heap of size k, and the heaps are merged at the end (never sort all scores). Measured: 18 cores take a
      100k x 384 scan from 7.3 ms to 0.82 ms (9x). Choose the worker count as min(GOMAXPROCS, rows/16384), so small
      indexes run on one goroutine and a search never spawns more goroutines than that; honour ctx cancellation between
      chunks. Ties break on node id so results are deterministic.
    status: completed
    notes: "PR #12"
    dependencies:
      - task-004
      - task-005
    acceptance_criteria:
      - "Results equal a single-threaded reference scan for random data, including ties"
      - "A search on 100k vectors uses more than one goroutine and is faster than the single-threaded scan on a multi-core machine"
      - "A cancelled context stops the scan promptly"

  - id: task-007
    title: "db.index.vector.queryNodes procedure"
    description: |
      Add the Neo4j-compatible built-in procedure CALL db.index.vector.queryNodes(indexName, k, queryVector)
      YIELD node, score, backed by the matrix (task-004), the kernels (task-005) and the parallel top-k (task-006).
      Score normalisation matches vector.similarity.*: cosine -> (1 + cos)/2, euclidean -> 1/(1 + d^2). Validate k >= 1
      and the query dimension; accept a LIST<number> or VECTOR query. Register it as a built-in in cypher/interp
      (call.go builtinProc) because it needs graph access, load the returned nodes by id, and add it to SHOW PROCEDURES.
      On the read-pool path it runs against an immutable matrix snapshot, so it is safe next to a writer.
    status: completed
    notes: "PR #12"
    dependencies:
      - task-006
    acceptance_criteria:
      - "The k nearest nodes are returned in descending score order with scores equal to vector.similarity.* on the same pair"
      - "An empty index returns no rows; a wrong query dimension is a clear error"
      - "Works inside a larger query (MATCH after CALL, WHERE on score) and on the read-only connection pool"

  - id: task-008
    title: "Go API: DB.VectorSearch"
    description: |
      Add (*DB) VectorSearch(ctx, indexName string, query []float64, k int) ([]VectorMatch, error) as a thin wrapper over
      the same code path for callers that do not use Cypher; VectorMatch carries *Node and Score.
    status: completed
    notes: "PR #12"
    dependencies:
      - task-007
    acceptance_criteria:
      - "VectorSearch returns the same matches and scores as the procedure"

  - id: task-009
    title: "Benchmark, record, and decide the follow-ups"
    description: |
      Benchmark queryNodes at 1k, 10k, 100k and 1M vectors at dimension 384 (and 768 at 100k): time to build the cache,
      memory used, queries per second, and the share of time in decoding, the kernel and the heap. Record the results
      next to the baseline below in .plans/progress-vector-search.txt. Then decide, from the numbers and not in advance:
        * hand-written SIMD assembly (arm64 NEON, amd64 AVX2, runtime CPU detection): only if the kernel, not memory
          bandwidth, is still the bottleneck at the scales users hit; otherwise record that it is not worth two kernels;
        * int8/float16 quantisation: relevant above a few million vectors or when memory is the limit (Neo4j's INTEGER8
          coordinate type already maps to it);
        * an approximate index (pure-Go HNSW): the answer for 1M+ vectors, where brute force is bound by memory bandwidth
          (about 1.5 GB per query at 384 float32). Write a short proposal rather than adopting a dependency speculatively.
    status: completed
    notes: "Numbers and decisions in .plans/progress-vector-search.txt (assembly, quantisation and HNSW deferred)"
    dependencies:
      - task-007
    acceptance_criteria:
      - "Benchmarks cover all four scales at dimension 384"
      - "Results and the three follow-up decisions are recorded in .plans/progress-vector-search.txt"

  - id: task-010
    title: "CGO-free check, documentation, final verification"
    description: |
      Verify go list -f '{{.CgoFiles}}' ./... across the dependency tree is empty. Document CREATE VECTOR INDEX,
      db.index.vector.queryNodes, VectorSearch, the in-memory cache (memory use, cap option) and the brute-force scope
      with the benchmark numbers in the README and AGENTS.md. Run the standard verification commands.
    status: completed
    notes: "README and AGENTS.md updated; builds with CGO_ENABLED=0 and no cgo files in the dependency tree"
    dependencies:
      - task-008
      - task-009
    acceptance_criteria:
      - "No CGO files anywhere in the dependency tree"
      - "README documents the vector index, procedure, Go API and cache behaviour with benchmark numbers"
      - "build, vet, tests, race and both compat suites pass"

