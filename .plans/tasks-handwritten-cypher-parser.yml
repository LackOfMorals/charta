feature: handwritten-cypher-parser
prd: ./prd-handwritten-cypher-parser.md
created_at: 2026-10-08T00:00:00Z
updated_at: 2026-10-08T00:00:00Z

tasks:
  # ───────────── Iteration 1: lexer + errors ─────────────
  - id: task-001
    title: "Create cypher/syntax package: tokens, positions, SyntaxError"
    description: |
      Add cypher/syntax/{token.go,errors.go}. Define Pos{Offset,Line,Col},
      Token kinds (punctuation, operators, literals, identifiers, parameters)
      and a case-insensitive keyword table covering every openCypher 9
      reserved word. Define *SyntaxError{Pos, Found, Expected []string, Msg}
      with a readable Error(). Only one file carries the package doc comment.
      Stdlib imports only.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "cypher/syntax compiles with CGO_ENABLED=0 and imports only the standard library"
      - "Keyword lookup is case-insensitive and covers the full openCypher 9 keyword list"
      - "SyntaxError.Error() includes line:col and the offending token"

  - id: task-002
    title: "Hand-written lexer"
    description: |
      Implement lexer.go: single pass over the input string, no regexp.
      Cover whitespace/comments (// and /* */), identifiers (unicode, backtick
      quoting with `` escape), $param and ${...}-free parameter forms
      ($name and $0), integer (decimal, hex 0x, octal 0o/leading 0), float
      (exponent), string literals ('' and "" with all escapes incl. \uXXXX,
      \UXXXXXXXX), operators (<> != <= >= =~ += .. ^ etc.). `1..3` must lex
      as INT DOTDOT INT, not a float. Unterminated strings/comments and bad
      escapes produce positioned SyntaxErrors.
    status: completed
    dependencies: [task-001]
    acceptance_criteria:
      - "Table tests cover every token kind plus each error case"
      - "`[*1..3]`, `1.5`, `1.`, `.5`, `1e3`, `0x1F`, `0o17` lex per the openCypher spec"
      - "Token positions are exact for multi-line input and multi-byte runes"

  - id: task-003
    title: "Lexer fuzz test and benchmark"
    description: |
      Add FuzzLex asserting no panic, no infinite loop, tokens cover the
      input in order, and EOF is always returned. Add a lexer benchmark.
    status: completed
    dependencies: [task-002]
    acceptance_criteria:
      - "go test -fuzz=FuzzLex -fuzztime=60s finds no failures"
      - "Seed corpus includes all queries from cypher/parser_test.go"

  # ───────────── Iteration 2: AST + expressions ─────────────
  - id: task-004
    title: "Define the typed AST"
    description: |
      Add ast.go with sealed interfaces Node/Expr/Clause/PatternElem and a
      Pos on every node. Expressions: Literal kinds, ListLit, MapLit, Param,
      Ident, Property, Subscript, Slice, Unary, Binary, Comparison chain,
      IsNull, In, StringPred, HasLabels, FuncCall (namespace, DISTINCT,
      star), Case, ListComp, PatternComp, Quantifier, Reduce, Exists,
      PatternExpr. Clauses/patterns are declared here too (parsed in later
      tasks). No ExprText/RawExpr string fields anywhere.
    status: completed
    dependencies: [task-001]
    acceptance_criteria:
      - "Every openCypher 9 grammar production has a corresponding AST node (checklist table in ast.go package comment)"
      - "No AST field holds unparsed source text, except ProjectionItem.Source (verbatim text used only to name un-aliased columns)"

  - id: task-005
    title: "Precedence-climbing expression parser (core operators)"
    description: |
      expr.go: OR < XOR < AND < NOT < comparison (chained) < + - < * / % <
      ^ (right-assoc) < unary +/- < postfix (IN, STARTS/ENDS/CONTAINS WITH,
      =~, IS [NOT] NULL, [i], [a..b], .prop, :Label) < atoms. Literals,
      parameters, identifiers, parenthesised, list and map literals.
    status: completed
    dependencies: [task-002, task-004]
    acceptance_criteria:
      - "Golden-AST tests for precedence/associativity incl. `a < b < c`, `2^3^2`, `-x^2`, `NOT a = b`"
      - "Precedence follows the openCypher grammar (string/list/null operators bind tighter than +; unary minus tighter than ^; ^ left-associative). Re-verify against TCK Precedence features in task-017 and adjust expr.go if they disagree"
      - "Errors report expected tokens with position"

  - id: task-006
    title: "Function calls, CASE, count(*), namespaces"
    description: |
      FuncCall with dotted namespace, DISTINCT, count(*); simple and generic
      CASE with ELSE; EXISTS(...) function form.
    status: completed
    dependencies: [task-005]
    acceptance_criteria:
      - "Tests for `count(*)`, `count(DISTINCT x)`, `a.b.f(x)`, nested CASE"

  - id: task-007
    title: "List/pattern comprehensions, quantifiers, reduce"
    description: |
      `[x IN list WHERE p | e]`, pattern comprehension `[(a)-->(b) WHERE p | e]`,
      all/any/none/single(x IN l WHERE p), reduce(acc = init, x IN l | e),
      Cypher 25 has dropped legacy filter()/extract(); do not implement them
      (confirm against the manual). Pattern comprehension and pattern predicates
      depend on the pattern parser (task-009); stub the call and wire it in
      task-009's acceptance.
    status: completed
    dependencies: [task-006]
    acceptance_criteria:
      - "List comprehension, quantifier and reduce forms parse into dedicated AST nodes with golden tests"
      - "Disambiguation of `[` list literal vs comprehension is covered by tests"

  # ───────────── Iteration 3: patterns ─────────────
  - id: task-008
    title: "Node and relationship patterns"
    description: |
      pattern.go: node `(v:L1:L2 {map|$param})`, relationship
      `-[v:T1|T2 *min..max {props}]->` in all directions, label/type
      disjunction (`:A|B`, `:A|:B`), variable-length forms (`*`, `*2`, `*..3`,
      `*1..`, `*1..3`), property maps with full expressions.
    status: completed
    dependencies: [task-005]
    acceptance_criteria:
      - "Golden tests for all direction/length/type forms"
      - "Property map values are typed Exprs, not text"

  - id: task-009
    title: "Pattern chains, named paths, shortestPath, pattern predicates"
    description: |
      Multi-hop chains, `p = (a)-[]->(b)`, shortestPath()/allShortestPaths(),
      comma-separated pattern parts, pattern predicates in expressions
      (`WHERE (a)-[:R]->()`), and finish the pattern comprehension wiring from
      task-007. Disambiguate parenthesised expression vs node pattern with
      bounded lookahead/backtracking.
    status: completed
    dependencies: [task-007, task-008]
    acceptance_criteria:
      - "`(a)` is parsed as pattern predicate only where a pattern is valid, as a parenthesised expr otherwise"
      - "Named path and shortestPath golden tests"

  # ───────────── Iteration 4: clauses ─────────────
  - id: task-010
    title: "Reading clauses and projection body"
    description: |
      MATCH/OPTIONAL MATCH [WHERE], UNWIND, WITH and RETURN (DISTINCT, `*`,
      `*, expr`, aliases, ORDER BY, SKIP, LIMIT in either order, WHERE on
      WITH).
    status: completed
    dependencies: [task-009]
    acceptance_criteria:
      - "Golden tests for each clause form including SKIP/LIMIT order variants"

  - id: task-011
    title: "Updating clauses"
    description: |
      CREATE, MERGE [ON CREATE SET…][ON MATCH SET…], SET (prop =, += map,
      variable = map, label), REMOVE (prop, labels), [DETACH] DELETE, FOREACH
      (v IN list | updating clauses).
    status: completed
    dependencies: [task-010]
    acceptance_criteria:
      - "Golden tests for every SET/REMOVE item form and nested FOREACH"

  - id: task-012
    title: "CALL, UNION, and full statement composition"
    description: |
      Standalone CALL ns.proc(args) [YIELD …], in-query CALL … YIELD … WHERE,
      UNION / UNION ALL, multi-part queries, and the grammar-level rules for
      clause ordering (reading* updating* return, WITH separation).
      Entry point Parse(string) (*Statement, error); reject trailing garbage.
    status: completed
    dependencies: [task-011]
    acceptance_criteria:
      - "Every openCypher 9 grammar production in the ast.go checklist is parsed"
      - "Invalid clause orderings produce SyntaxErrors, not panics"

  - id: task-013
    title: "Parser fuzz, benchmark and corpus test"
    description: |
      FuzzParse (no panic/hang). Parse every query string extracted from
      compat/testdata/tck, cypher/*_test.go, sql/translator_test.go and
      testdata/rapid. Benchmark the reference query against the ANTLR
      baseline (9.5ms / 135k allocs).
    status: pending   # intent met in pieces, see progress file decision 3; confirm and close
    dependencies: [task-012, task-033]
    acceptance_criteria:
      - "go test -fuzz=FuzzParse -fuzztime=5m finds no failures"
      - "Benchmark shows >=100x speed-up and >=100x fewer allocs than ANTLR"
      - "Every query in the corpus either parses or is a documented negative test"

  # ───────────── Iteration 4b: Neo4j extensions (parser) ─────────────
  - id: task-028
    title: "Label expressions and relationship type expressions"
    description: |
      `:A&B`, `:A|B`, `:!A`, `:%`, parenthesised combinations in node and
      relationship patterns and in WHERE label predicates. Replace plain
      label/type lists in the AST with LabelExpr/RelTypeExpr (a plain list
      remains the simple case). Update openCypher `:A|:B` legacy form.
    status: completed
    dependencies: [task-009]
    acceptance_criteria:
      - "Golden tests for every operator and precedence (! > & > |)"
      - "Examples from the Neo4j Cypher Manual 'Label expressions' section parse"

  - id: task-029
    title: "Subquery expressions and CALL subqueries"
    description: |
      EXISTS { ... } (pattern shorthand and full subquery), COUNT { ... },
      COLLECT { ... }, CALL { ... } with importing WITH / scoped variable
      clause, OPTIONAL CALL, and `IN TRANSACTIONS [OF n ROWS] [ON ERROR …]`
      (parsed; execution is a non-goal).
    status: completed
    dependencies: [task-012]
    acceptance_criteria:
      - "Nested subqueries and subqueries inside WHERE/RETURN parse with golden tests"
      - "Variable-scope clause forms of CALL parse"

  - id: task-030
    title: "Quantified path patterns and path selectors"
    description: |
      `((a)-[:R]->(b) WHERE …){m,n}`, `+`/`*` quantified relationships,
      ANY / ALL SHORTEST / ANY SHORTEST / SHORTEST k [GROUPS] selectors,
      WHERE inside parenthesised and relationship patterns. Handle
      `(` disambiguation (node vs parenthesised expr vs quantified path)
      with bounded lookahead.
    status: completed
    dependencies: [task-028]
    acceptance_criteria:
      - "Manual examples for QPPs and selectors parse; ambiguity tests included"
      - "Pre-existing var-length `[*1..3]` still parses identically"

  - id: task-031
    title: "Map projections, dynamic labels/types/properties, type predicates"
    description: |
      `n{.name, .age, k: expr, .*, v}`, `$(expr)` in labels/types, `n[$prop]`
      dynamic property access, SET/REMOVE with dynamic labels,
      `IS [NOT] :: TYPE`, `IS [NOT] NORMALIZED`.
    status: completed
    dependencies: [task-006]
    acceptance_criteria:
      - "Golden tests for each form; error positions are exact for malformed projections"

  - id: task-032
    title: "Statement prefixes, schema commands, and server-only commands"
    description: |
      EXPLAIN / PROFILE, `CYPHER 25` / `CYPHER runtime=…` prefix (other
      versions rejected in task-033), USING hints (parsed, ignored), LOAD CSV [WITH HEADERS] FROM …
      [FIELDTERMINATOR]. Schema: CREATE|DROP INDEX / CONSTRAINT [IF [NOT]
      EXISTS], SHOW INDEXES / CONSTRAINTS / PROCEDURES / FUNCTIONS (types
      per prd-property-indexes-constraints.md and prd-vector-search.md).
      Server-only commands (USE, user/role/database management, GRANT/DENY)
      parse to a ServerOnlyCommand node so the planner can return a clear
      'not supported in graphlite' error.
    status: completed
    dependencies: [task-012]
    acceptance_criteria:
      - "Each statement kind parses into a typed node; server-only commands produce ServerOnlyCommand"
      - "Index/constraint node shapes agree with the property-indexes and vector-search PRDs"

  - id: task-033
    title: "Cypher 25 clauses and removed-syntax rejection"
    description: |
      Always-on Cypher 25 grammar (no dialect option), verified against the
      Cypher Manual: FILTER [WHERE] expr, LET v = e [, v = e], FINISH (must be
      last), OFFSET (alias of SKIP), WHEN … THEN { } [ELSE { }] bodies inside
      CALL / COLLECT (done in task-029), `CYPHER 25 [key=value]` prefix;
      `CYPHER 5` / other versions are rejected with "graphlite implements
      Cypher 25". The removed list functions extract(x IN …) / filter(x IN …)
      are rejected with a pointer to list comprehensions.
      DEFERRED (not found in the manual, so not guessed): NEXT, INSERT and a
      standalone ORDER BY/SKIP/LIMIT statement. Their placeholder AST nodes
      were removed; add them when the manual documents the syntax.
    status: completed
    dependencies: [task-029, task-031]
    acceptance_criteria:
      - "FILTER, LET, FINISH, OFFSET and conditional bodies parse; CYPHER 5 and extract()/filter() return errors that say what to use instead"
      - "NEXT / INSERT / standalone ORDER BY are explicitly deferred in this file and the PRD"

  - id: task-034
    title: "Neo4j-extension scenario suite (Gherkin) — blocked on execution support (iteration 10)"
    description: |
      Create compat/testdata/neo4j/*.feature in the TCK Gherkin format,
      derived from Neo4j Cypher Manual examples, covering every Tier A
      construct (expected results, not just parse success). Wire into the
      tck harness behind its own skip/executed counters so progress is
      reported separately from openCypher TCK.
    status: pending
    dependencies: [task-030, task-031, task-032]
    acceptance_criteria:
      - "Suite runs under -tags=tck; initial pass rate recorded; failures are tracked per construct"

