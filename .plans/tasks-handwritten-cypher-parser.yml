    status: completed
    dependencies: [task-016]
    acceptance_criteria:
      - "Full TCK vendored; harness runs end to end"
      - "Scenarios needing syntax removed in Cypher 25 are identified and listed in compat/testdata/excluded.txt with reasons"
      - "Baseline report committed"

  - id: task-018
    title: "Semantic analysis pass (compile-time errors with TCK codes)"
    description: |
      DONE. New package cypher/analyze (imports cypher/syntax only) with a typed
      Error{Class, Code, Pos, Msg}, Check(), and Describe(); lexer/parser errors
      carry a TCK Code (syntax.SyntaxError.Code / ErrorCode()). cypher.Parse runs
      syntax.Parse -> analyze.Check -> lowering. The TCK harness now requires class
      and code to match for compile-time expectations.
      Sub-steps delivered:
        A. error type, plumbing, strict harness
        B. scope analysis (UndefinedVariable, VariableAlreadyBound,
           VariableTypeConflict, ColumnNameConflict, NoExpressionAlias,
           NoVariablesInScope, ORDER BY scoping, pattern-predicate variables)
        C. aggregation (InvalidAggregation, AmbiguousAggregationExpression,
           NestedAggregation, NonConstantExpression)
        D. literal/lexical codes (IntegerOverflow, FloatingPointOverflow,
           InvalidNumberLiteral, InvalidUnicodeLiteral/Character, UnexpectedSyntax)
        E. clause/pattern rules (NoSingleRelationshipType,
           RequiresDirectedRelationship, CreatingVarLength, InvalidParameterUse,
           InvalidRelationshipPattern, RelationshipUniquenessViolation,
           InvalidDelete, InvalidClauseComposition, DifferentColumnsInUnion,
           NegativeIntegerArgument, SKIP/LIMIT argument types)
        F. static type inference (InvalidArgumentType incl. TypeError for
           non-map property access) and UnknownFunction (function registry);
           ProcedureNotFound for names outside db.*/dbms.*/tx.*
      Not covered (belong elsewhere): procedure signatures/arguments
      (InvalidNumberOfArguments, InvalidArgumentPassingMode, MissingParameter ->
      task-026) and every runtime error expectation.
    status: completed
    dependencies: [task-017]
    acceptance_criteria:
      - "A typed *analyze.Error (class + TCK code + position) reaches the caller through graphlite's error wrapping: done (analyze.Describe, used by the harness)"
      - "The harness requires class and code to match for 'at compile time' expectations: done"
      - "Every TCK scenario expecting a compile-time error passes with the right code: 586/586 cases (cypher/analyze TestTCK_CompileTimeErrors), 0 of 4,176 valid queries wrongly rejected (TestTCK_ValidScenariosPass)"
      - "TCK pass rate over executed scenarios: 816/2,631 (31.0%) -> 911/2,631 (34.6%)"

  - id: task-039
    title: "Retire ExprText: planner consumes typed property-map expressions"
    description: |
      DONE. Property-map values, SET values (n.p = v and n += {map}), ORDER BY
      keys and DELETE targets are typed Exprs in the Query AST, lowered from the
      syntax tree; the planner's expression-text parser (parseExprText) and the
      "__list__:" / verbatim-text encodings are gone. The verbatim-source fields
      were removed from cypher/syntax (MapEntry.Source, ListLit.Sources,
      SetItem.ValueSource, Delete.Sources, SortItem.Source) EXCEPT
      ProjectionItem.Source, which un-aliased result columns need.
      Negative numeric literals now lower to plain LiteralExprs (the text path
      handled -1; the typed path must too); planValue keeps a bare unbound
      variable (ORDER BY alias) as a RawExpr identifier, as before.
    status: completed
    dependencies: [task-018]
    acceptance_criteria:
      - "NodePattern.Props, SetItem values, SortItem and DeleteClause.Exprs are typed expressions: done"
      - "No Source/ValueSource/Sources fields remain in cypher/syntax except ProjectionItem.Source (documented: column naming)"
      - "TCK pass rate not lower, compared scenario by scenario: 911 -> 950 passed, 0 regressions, 39 improvements"

