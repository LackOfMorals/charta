  # ───────────── Iteration 7: semantic analysis ─────────────
  - id: task-017
    title: "Import full openCypher TCK and baseline pass rate"
    description: |
      Replace the 15 vendored .feature files with the full TCK for the
      pinned openCypher version. Record per-feature pass/skip/fail counts as
